<!DOCTYPE html>
<html>
<head>
  <title>SMAT Kanban</title>
</head>
<body>
  <iframe 
    src="https://script.google.com/a/macros/psa.gov.ph/s/AKfycbznm-IxOnNAlOKfMMhhYLHGRql7O-w0tu2PFiKaj5f-AAmuP8IIlnL4ML-rbCP_D_dzgw/exec?mode=public"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
